<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; padding: 14px; margin: 0; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 13px; margin: 10px 0 3px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      button { margin-top: 14px; width: 100%; padding: 8px; font-size: 14px;
               background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
      .hint { font-size: 11px; color: #666; margin-top: 4px; }
      #saved { font-size: 12px; color: #1a7f37; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>ShopSense 设置</h1>

    <label for="backendUrl">后端地址（留空则用本地兜底）</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
    <div class="hint">填入你的 FastAPI 后端，自动接管解读。</div>

    <div class="row">
      <div>
        <label for="height">身高 (cm)</label>
        <input id="height" type="number" min="100" max="220" />
      </div>
      <div>
        <label for="weight">体重 (kg)</label>
        <input id="weight" type="number" min="30" max="200" />
      </div>
    </div>

    <button id="save">保存</button>
    <div id="saved" role="status" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
